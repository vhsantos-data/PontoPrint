<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos — Ponto Print</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=1">
  <link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body class="admin">
  <header class="top">
    <a class="brand" href="/"><span>Ponto</span><i class="brand__dot" aria-hidden="true"></i><span>Print</span></a>
    <span class="admin__title">Pedidos de orçamento</span>
    <button class="btn btn--sm" id="logout" type="button" hidden>Sair</button>
  </header>

  <main class="section">
    <!-- Login -->
    <form class="sheet sheet--narrow admin__login" id="login" novalidate>
      <h2>Entrar no painel</h2>
      <p class="sub">Use o token de acesso definido no servidor (ADMIN_TOKEN).</p>
      <div class="field">
        <label for="token">Token</label>
        <input id="token" type="password" autocomplete="current-password" required>
        <small class="field__err" aria-live="polite"></small>
      </div>
      <button class="btn btn--ink" type="submit">Entrar</button>
    </form>

    <!-- Painel -->
    <section class="sheet admin__panel" id="panel" hidden>
      <div class="admin__summary" id="summary"></div>

      <div class="admin__toolbar">
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">Ativos (sem spam)</option>
            <option value="novo">Novo</option>
            <option value="contatado">Contatado</option>
            <option value="orcado">Orçado</option>
            <option value="fechado">Fechado</option>
            <option value="perdido">Perdido</option>
            <option value="spam">Spam</option>
          </select>
        </div>
        <div class="field admin__search">
          <label for="f-q">Buscar</label>
          <input id="f-q" type="search" placeholder="nome, telefone, e-mail ou texto" maxlength="60">
        </div>
        <button class="btn btn--sm" id="refresh" type="button">Atualizar</button>
        <a class="btn btn--sm btn--ink" id="csv" href="#" download>Exportar CSV</a>
      </div>

      <p class="admin__status" id="status" role="status" aria-live="polite"></p>

      <div class="admin__list" id="list"></div>

      <div class="admin__pager">
        <button class="btn btn--sm" id="prev" type="button">Anteriores</button>
        <span id="pageinfo"></span>
        <button class="btn btn--sm" id="next" type="button">Próximos</button>
      </div>
    </section>
  </main>

  <template id="tpl-lead">
    <article class="lead-card">
      <header class="lead-card__head">
        <div>
          <strong class="lead-card__name"></strong>
          <span class="lead-card__meta"></span>
        </div>
        <select class="lead-card__status" aria-label="Status do pedido">
          <option value="novo">Novo</option>
          <option value="contatado">Contatado</option>
          <option value="orcado">Orçado</option>
          <option value="fechado">Fechado</option>
          <option value="perdido">Perdido</option>
          <option value="spam">Spam</option>
        </select>
      </header>
      <dl class="lead-card__info">
        <div><dt>WhatsApp</dt><dd><a class="lead-card__wa" target="_blank" rel="noopener"></a></dd></div>
        <div><dt>E-mail</dt><dd class="lead-card__email"></dd></div>
        <div><dt>Tipo</dt><dd class="lead-card__tipo"></dd></div>
        <div><dt>Quantidade</dt><dd class="lead-card__qtd"></dd></div>
      </dl>
      <p class="lead-card__msg"></p>
    </article>
  </template>

  <script src="/admin/admin.js?v=1" defer></script>
</body>
</html>
