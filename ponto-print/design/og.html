<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;font-family:Archivo,Helvetica,Arial,sans-serif;background:#fff;color:#0e0e0e;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;padding:72px 76px;display:flex;flex-direction:column;justify-content:space-between}
  .bar{position:absolute;left:0;right:0;display:flex;height:14px}
  .bar--top{top:0}.bar--bottom{bottom:0;height:18px}
  .bar i{flex:1}
  .bar i:nth-child(1){background:#00aeef}.bar i:nth-child(2){background:#ec008c}
  .bar i:nth-child(3){background:#ffe600}.bar i:nth-child(4){background:#0e0e0e}
  .brand{display:flex;align-items:baseline;font-size:44px;font-weight:800;letter-spacing:-.045em}
  .dot{width:20px;height:20px;border-radius:50%;background:#ec008c;margin:0 7px 2px}
  h1{font-size:82px;line-height:.98;font-weight:800;letter-spacing:-.045em;max-width:16ch}
  h1 .hl{position:relative;display:inline-block}
  h1 .hl::after{content:"";position:absolute;left:-4px;right:-4px;bottom:8px;height:16px;background:#ffe600;z-index:-1}
  .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .tags span{border:2px solid #0e0e0e;border-radius:999px;padding:7px 17px;font-size:21px;font-weight:600}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .foot p{font-size:25px;font-weight:600;color:#55565a}
  .foot p b{color:#0e0e0e}
  .wa{display:flex;align-items:center;gap:12px;background:#0e0e0e;color:#fff;border-radius:999px;padding:15px 26px;font-size:25px;font-weight:700}
  .wa svg{width:27px;height:27px;fill:#fff}
  .sheets{position:absolute;right:-40px;top:150px;display:flex;gap:14px;transform:rotate(-8deg);opacity:.1}
  .sheets i{width:104px;height:150px;border:3px solid #0e0e0e;border-radius:6px;display:block}
</style></head>
<body>
  <div class="card">
    <div class="bar bar--top"><i></i><i></i><i></i><i></i></div>
    <div class="sheets"><i></i><i></i><i></i></div>
    <div class="brand">Ponto<span class="dot"></span>Print</div>
    <div>
      <h1>Impressão que dá vida às <span class="hl">suas ideias</span>.</h1>
      <div class="tags"><span>Placas &amp; sinalização</span><span>Adesivos em vinil</span><span>Plotagem A0</span><span>Impressões</span><span>Personalizados</span></div>
    </div>
    <div class="foot">
      <p>Gráfica rápida em <b>Osasco — SP</b><br>Seg a sex, 8h às 18h</p>
      <div class="wa">

      </div>
    </div>
    <div class="bar bar--bottom"><i></i><i></i><i></i><i></i></div>
  </div>
</body></html>
