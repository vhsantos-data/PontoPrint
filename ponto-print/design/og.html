<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;font-family:Archivo,Helvetica,Arial,sans-serif;background:#fff;color:#000;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 470px;grid-template-rows:630px}
  .txt{padding:58px 44px 54px 68px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
  .bar{position:absolute;left:0;right:0;display:flex;height:14px;z-index:2}
  .bar--top{top:0}.bar--bottom{bottom:0;height:18px}
  .bar i{flex:1}
  .bar i:nth-child(1){background:#1c9dd9}.bar i:nth-child(2){background:#e50e7e}
  .bar i:nth-child(3){background:#f9eb1e}.bar i:nth-child(4){background:#000}
  .logo{height:88px;width:auto;align-self:flex-start;flex:none}
  h1{font-size:60px;line-height:.98;font-weight:800;letter-spacing:-.045em;max-width:11ch}
  h1 .hl{position:relative;display:inline-block}
  h1 .hl::after{content:"";position:absolute;left:-4px;right:-2px;bottom:5px;height:14px;background:#f9eb1e;z-index:-1}
  .tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
  .tags span{border:2px solid #000;border-radius:999px;padding:6px 15px;font-size:19px;font-weight:600}
  .foot{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .foot p{font-size:22px;font-weight:600;color:#55565a}
  .foot p b{color:#000}
  .wa{display:flex;align-items:center;gap:10px;background:#000;color:#fff;border-radius:999px;padding:13px 22px;font-size:22px;font-weight:700}
  .wa svg{width:24px;height:24px;fill:#fff}
  .fotos{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:0;height:630px;overflow:hidden}
  .fotos img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
<body>
  <div class="card">
    <div class="bar bar--top"><i></i><i></i><i></i><i></i></div>
    <div class="txt">
      <img class="logo" src="../public/assets/marca/logo.png" alt="">
      <div>
        <h1>Sua ideia,<br><span class="hl">a gente imprime.</span></h1>
        <div class="tags"><span>Placas</span><span>Adesivos</span><span>Plotagem</span><span>Impressões</span><span>Personalizados</span></div>
      </div>
      <div class="foot">
        <p>Gráfica rápida em <b>Osasco — SP</b></p>
        <div class="wa">
          <svg viewBox="0 0 24 24"><path d="M12.04 2A9.9 9.9 0 0 0 2.1 11.9c0 1.75.46 3.46 1.34 4.96L2 22l5.28-1.38a9.9 9.9 0 0 0 4.76 1.21h.01a9.9 9.9 0 0 0 9.9-9.9A9.9 9.9 0 0 0 12.04 2Zm0 18.13h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.13.82.84-3.05-.2-.31a8.2 8.2 0 1 1 6.98 3.87Zm4.5-6.15c-.25-.12-1.46-.72-1.68-.8-.23-.09-.39-.13-.55.12-.16.25-.64.8-.78.97-.14.16-.29.18-.53.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.23-1.46-1.37-1.7-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.55-1.34-.76-1.83-.2-.48-.4-.41-.55-.42h-.47c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.88 2.35 1 2.51c.12.16 1.73 2.65 4.2 3.72.59.25 1.05.4 1.4.52.59.19 1.12.16 1.55.1.47-.07 1.46-.6 1.66-1.17.21-.58.21-1.07.14-1.17-.06-.11-.22-.17-.46-.29Z"/></svg>
          (11) 91969-3833
        </div>
      </div>
    </div>
    <div class="fotos">
      <img src="../public/assets/portfolio/placas-sinalizacao.webp" alt="">
      <img src="../public/assets/portfolio/adesivos.webp" alt="">
      <img src="../public/assets/portfolio/brindes.webp" alt="">
    </div>
    <div class="bar bar--bottom"><i></i><i></i><i></i><i></i></div>
  </div>
</body></html>
